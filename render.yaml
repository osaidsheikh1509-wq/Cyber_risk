services:
  - type: web
    name: cyber-risk-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: Cyber Risk Tracker API
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: DB_BACKEND
        value: mongo
      - key: DB_FALLBACK
        value: "true"
      - key: MONGODB_DB
        value: cyber_risk_tracker
      - key: MODEL_BACKEND
        value: mock
      - key: ALLOWED_ORIGINS
        value: "*"
